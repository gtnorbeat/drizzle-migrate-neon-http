name: Publish to npm

on:
  push:
    tags:
      - "v*"
  # Allow manual trigger from the Actions tab (useful to re-run a failed publish)
  workflow_dispatch:

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run test
      - run: npm run lint

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: test
    # Only publish for version tags; ignore arbitrary v-prefixed branches.
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      id-token: write # required for npm provenance (attestations)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
          cache: npm
      - run: npm ci

      # Guard: the tag must match package.json version (v1.2.3 → 1.2.3).
      # Prevents publishing a tag whose version wasn't bumped first.
      - name: Verify tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag '$GITHUB_REF_NAME' does not match package.json version '$PKG'"
            exit 1
          fi
          echo "✅ tag v$TAG == package.json $PKG"

      - name: Publish to npm
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
