name: Publish to npm

on:
  push:
    tags:
      - "v*"
  # Allow manual trigger from the Actions tab (useful to re-run a failed publish)
  workflow_dispatch:

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run test
      - run: npm run lint

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: test
    # Only publish for version tags; ignore arbitrary v-prefixed branches.
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      id-token: write # required for npm provenance (attestations)
    steps:
      # Full history is needed to compare against the previous release tag.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
          cache: npm

      # Release gate (fail-fast, before npm ci): the tag must be valid plain
      # SemVer, match package.json, and be a coherent bump from the previous
      # release tag — exactly one of MAJOR/MINOR/PATCH increments by 1
      # (see CONTRIBUTING.md → Releasing).
      - name: Validate release tag (SemVer + package.json + coherent bump)
        run: node script/check-release.mjs "$GITHUB_REF_NAME"

      - run: npm ci

      # The E2E on Neon workflow also triggers on v* tags. GitHub runs
      # separate workflows in parallel, so wait for it to finish before
      # publishing — a failed end-to-end run blocks the release.
      - name: Wait for E2E on Neon to pass
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 40); do
            RUN="$(gh api \
              "repos/${{ github.repository }}/actions/workflows/e2e-neon.yml/runs?event=push&head_sha=${{ github.sha }}" \
              --jq '.workflow_runs[0].status, .workflow_runs[0].conclusion')"
            STATUS="$(echo "$RUN" | sed -n 1p)"
            CONCLUSION="$(echo "$RUN" | sed -n 2p)"
            echo "E2E run: status=$STATUS conclusion=${CONCLUSION:-pending}"
            if [ "$STATUS" = "completed" ]; then
              if [ "$CONCLUSION" = "success" ]; then
                echo "✅ E2E on Neon passed"
                exit 0
              fi
              echo "::error::E2E on Neon did not pass (conclusion: $CONCLUSION)"
              exit 1
            fi
            sleep 15
          done
          echo "::error::Timed out waiting for the E2E on Neon workflow"
          exit 1

      - name: Publish to npm
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
